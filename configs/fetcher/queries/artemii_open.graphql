query($owner: String!, $name: String!, $cursor: String) {
  repository(owner: $owner, name: $name) {
    pullRequests(states: OPEN, first: 100, after: $cursor) {
      nodes {
        number
        title
        author { login }
        createdAt
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}